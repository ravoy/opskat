name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop/*

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - run: go test ./...

  e2e:
    name: Wails E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Cache Wails CLI
        uses: actions/cache@v5
        with:
          path: ~/go/bin/wails3
          key: wails-cli-${{ runner.os }}-v3.0.0
      - name: Install Wails CLI
        run: command -v wails3 || go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Install frontend dependencies
        run: cd frontend && bun x --bun pnpm@10.11.0 install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
      - name: Install e2e dependencies
        run: cd e2e && bun x --bun pnpm@10.11.0 install --frozen-lockfile && bun --bun x playwright install --with-deps chromium
      - name: Typecheck e2e
        run: cd e2e && bun --bun run typecheck
      - name: Test
        run: xvfb-run -a make test-e2e
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wails-e2e-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
            /tmp/opskat-e2e-*.log
          if-no-files-found: ignore

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: cd frontend && bun x --bun pnpm@10.11.0 install --frozen-lockfile
      - name: Lint
        run: cd frontend && bun --bun run lint

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Wails CLI
        uses: actions/cache@v5
        with:
          path: ~/go/bin/wails3
          key: wails-cli-${{ runner.os }}-v3.0.0
      - name: Install Wails CLI
        run: command -v wails3 || go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - name: Generate Wails bindings
        run: bun scripts/desktop.mjs bindings
      - name: Install dependencies
        run: cd frontend && bun x --bun pnpm@10.11.0 install --frozen-lockfile
      - name: Test
        run: cd frontend && bun --bun run test
